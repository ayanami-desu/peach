name: Docker

# fork 上只做一件事：dev 推送时构建镜像并推到 GHCR，服务器按 sha 标签拉取。
# 其余继承自上游的流水线（Test、Release、看板同步、Star History、覆盖升级验收）
# 已从分支移除，见 docs/DEPLOYMENT.md「镜像发布体系」。
on:
  push:
    branches: [dev]
    paths:
      [
        Dockerfile,
        .dockerignore,
        compose.yaml,
        "src/**",
        "migrations/**",
        "web/**",
        "resources/**",
        pyproject.toml,
        uv.lock,
        setup.py,
        MANIFEST.in,
        scripts/smoke_docker.py,
        .github/workflows/docker.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Linux amd64 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@v4
      - name: 构建候选镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: longmeidao/peach:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 验收临时容器
        run: python3 scripts/smoke_docker.py longmeidao/peach:test
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 推送 dev 镜像
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker tag longmeidao/peach:test "$IMAGE:dev"
          docker tag longmeidao/peach:test "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:dev"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
