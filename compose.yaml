services:
  peach:
    image: longmeidao/peach:${PEACH_VERSION:-edge}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 75s
    # 检查命令沿用镜像的 HEALTHCHECK，这里只定时间参数，默认值与镜像相同；写入敏感的宿主机见 docs/DOCKER.md。
    healthcheck:
      interval: ${PEACH_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${PEACH_HEALTHCHECK_TIMEOUT:-5s}
      start_period: ${PEACH_HEALTHCHECK_START_PERIOD:-60s}
      retries: ${PEACH_HEALTHCHECK_RETRIES:-3}
    # 容器标准输出的日志；PEACH_LOG_DRIVER 只能是 json-file 或 local，两者都按下面的大小轮转。
    logging:
      driver: ${PEACH_LOG_DRIVER:-json-file}
      options:
        max-size: ${PEACH_LOG_MAX_SIZE:-10m}
        max-file: ${PEACH_LOG_MAX_FILE:-3}
    # 可选：还没有访问设置时，启动就用 `PEACH_ACCESS_PASSWORD` 设访问密码（8–256 个字符），首次设置页
    # 不再问；已有访问设置时忽略。用法是在 .env 里写这个变量，再取消下面两行的注释。
    # environment:
    #   PEACH_ACCESS_PASSWORD: ${PEACH_ACCESS_PASSWORD}
    ports:
      # NAS / 局域网：在 .env 中设置 PEACH_BIND 为宿主机的局域网 IP。
      # 127.0.0.1 仅供宿主机访问；PEACH_PORT 可修改宿主机端口。
      - "${PEACH_BIND:-127.0.0.1}:${PEACH_PORT:-8900}:8900"
    volumes:
      - peach-data:/data

volumes:
  peach-data:
